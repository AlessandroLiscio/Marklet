# The mechanism that makes "lightweight" a constraint instead of a wish.
#
# The two ceilings mean different things, and confusing them defeats both:
#
#   LITE  2.8 MiB — a promise. Marklet Lite exists because mdview is 2 MB and
#     starts in under a second, and that is the only reason a new Markdown
#     viewer is worth writing. Every feature argues against it, and arguments
#     win unless something is holding a scale.
#
#   FULL  12 MiB — a tripwire, not a promise. The full edition is deliberately
#     NOT bound by the lightweight rule: it is allowed webfonts, motion, tabs,
#     regex search, CJK detection, an updater. This ceiling exists only to catch
#     an accident — a 40 MB dependency pulled in by mistake — and is cheap to
#     raise, because nobody was promised it.
#
# Called by main.yml after build.yml, on pull requests only. Raising the LITE
# ceiling is Alessandro's decision, taken on a measurement, in its own commit.
# See .claude/skills/size-budget/SKILL.md and docs/editions.md.
name: Size gate

on:
  workflow_call:
  workflow_dispatch:

jobs:
  gate:
    # Load-bearing: forms the required-check context "size-gate / Enforce budget".
    # See main.yml.
    name: Enforce budget
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: marklet-setup
          path: artifacts/full

      - uses: actions/download-artifact@v5
        with:
          name: marklet-lite-setup
          path: artifacts/lite

      - name: Measure and enforce
        run: |
          set -euo pipefail

          FULL_MAX=12582912  # 12 MiB  - a tripwire for accidents
          LITE_MAX=2936013   # 2.8 MiB - a promise

          full=$(find artifacts/full -name '*.exe' -printf '%s\n' | sort -nr | head -1)
          lite=$(find artifacts/lite -name '*.exe' -printf '%s\n' | sort -nr | head -1)

          human() { numfmt --to=iec-i --suffix=B --format='%.2f' "$1"; }

          {
            echo "| Artifact | Size | Ceiling | Headroom |"
            echo "|---|---:|---:|---:|"
            echo "| \`marklet-setup.exe\` | $(human "$full") | $(human $FULL_MAX) | $(human $((FULL_MAX - full))) |"
            echo "| \`marklet-lite-setup.exe\` | $(human "$lite") | $(human $LITE_MAX) | $(human $((LITE_MAX - lite))) |"
          } | tee -a "$GITHUB_STEP_SUMMARY" > gate-table.md

          fail=0
          if [ "$full" -gt "$FULL_MAX" ]; then
            echo "::error::full installer is $((full - FULL_MAX)) bytes over budget"
            fail=1
          fi
          if [ "$lite" -gt "$LITE_MAX" ]; then
            echo "::error::lite installer is $((lite - LITE_MAX)) bytes over budget"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo
            echo "LITE over budget: work through the list in"
            echo ".claude/skills/size-budget/SKILL.md - gate an import, move it behind a"
            echo "build switch, move it to the full edition only, or cut the feature."
            echo "Raising the lite ceiling is not on that list; it is the promise."
            echo
            echo "FULL over budget: this ceiling is a tripwire, not a promise. Something"
            echo "large arrived - find out what before deciding whether to raise it."
            exit 1
          fi

      - name: Comment the table on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let table;
            try {
              table = fs.readFileSync('gate-table.md', 'utf8');
            } catch {
              table = '_Build failed before the installers could be measured._';
            }
            const marker = '### Size gate';
            const body = `${marker}\n\n${table}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = (await github.rest.issues.listComments({ owner, repo, issue_number }))
              .data.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
