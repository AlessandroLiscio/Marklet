name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The version lives in three files. A mismatch produces an installer whose
  # displayed version is not the one in the tag, and only a user notices.
  verify-version:
    name: Verify version agreement
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          cargo_v=$(sed -n '/^\[package\]/,/^\[/p' src-tauri/Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=$tag package.json=$pkg Cargo.toml=$cargo_v tauri.conf.json=$conf"
          for v in "$pkg" "$cargo_v" "$conf"; do
            [ "$v" = "$tag" ] || { echo "::error::version mismatch against tag $tag"; exit 1; }
          done

  build:
    name: ${{ matrix.name }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-full
            os: windows-latest
            args: ""
            lite: ""
          # Mermaid lives in the frontend bundle, so the lite build is an
          # environment variable Vite reads, not a cargo feature.
          - name: windows-lite
            os: windows-latest
            args: ""
            lite: "1"
          # ~127 MB: it embeds the whole WebView2 runtime. Tag builds only,
          # for air-gapped machines. Never the default download.
          - name: windows-offline
            os: windows-latest
            args: "--config {\"bundle\":{\"windows\":{\"webviewInstallMode\":{\"type\":\"offlineInstaller\"}}}}"
            lite: ""
          - name: linux
            os: ubuntu-22.04
            args: ""
            lite: ""

    steps:
      - uses: actions/checkout@v5

      - name: Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential \
            curl wget file pkg-config libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build
        run: npx tauri build ${{ matrix.args }}
        env:
          MARKLET_LITE: ${{ matrix.lite }}

      - name: Rename artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          ver="${GITHUB_REF_NAME#v}"
          case "${{ matrix.name }}" in
            windows-full)    cp src-tauri/target/release/bundle/nsis/*.exe "out/marklet-setup-$ver.exe" ;;
            windows-lite)    cp src-tauri/target/release/bundle/nsis/*.exe "out/marklet-lite-setup-$ver.exe" ;;
            windows-offline) cp src-tauri/target/release/bundle/nsis/*.exe "out/marklet-offline-setup-$ver.exe" ;;
            linux)
              cp src-tauri/target/release/bundle/appimage/*.AppImage "out/marklet-$ver.AppImage"
              cp src-tauri/target/release/bundle/deb/*.deb "out/marklet-$ver.deb"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  # Cold start is the promise the whole project rests on, so it gates the
  # release rather than merely reporting.
  cold-start-gate:
    name: Cold start gate
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: release-windows-full
          path: out
      - name: Median of 5 runs
        shell: pwsh
        run: |
          $exe = (Get-ChildItem out -Filter *.exe | Select-Object -First 1).FullName
          Start-Process -FilePath $exe -ArgumentList '/S' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Marklet\marklet.exe"
          $times = 1..5 | ForEach-Object {
            $out = & $app --benchmark tests/fixtures/large.md 2>&1 | Out-String
            if ($out -match 'boot-ms=(\d+)') { [int]$Matches[1] } else { throw "no boot-ms in output" }
          }
          $median = ($times | Sort-Object)[2]
          "cold start runs: $($times -join ', ') -> median ${median} ms" |
            Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($median -gt 1200) { throw "median ${median} ms exceeds the 1200 ms ceiling" }

  publish:
    name: Publish
    needs: [build, cold-start-gate]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: out

      - name: Checksums and size table
        run: |
          set -euo pipefail
          cd out
          sha256sum ./* > SHA256SUMS
          {
            echo "| Artifact | Size |"
            echo "|---|---:|"
            for f in *; do
              [ "$f" = "SHA256SUMS" ] && continue
              printf '| `%s` | %s |\n' "$f" "$(numfmt --to=iec-i --suffix=B --format='%.2f' "$(stat -c%s "$f")")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: true
