name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The version lives in three files. A mismatch produces an installer whose
  # displayed version is not the one in the tag, and only a user notices.
  verify-version:
    name: Verify version agreement
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          cargo_v=$(sed -n '/^\[package\]/,/^\[/p' src-tauri/Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=$tag package.json=$pkg Cargo.toml=$cargo_v tauri.conf.json=$conf"
          for v in "$pkg" "$cargo_v" "$conf"; do
            [ "$v" = "$tag" ] || { echo "::error::version mismatch against tag $tag"; exit 1; }
          done

  build:
    name: ${{ matrix.name }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-full
            os: windows-latest
            args: "--features full"
            edition: full
          # Lite is its own product, not a stripped full. See docs/editions.md.
          - name: windows-lite
            os: windows-latest
            args: ""
            edition: lite
          # ~127 MB: it embeds the whole WebView2 runtime. Tag builds only,
          # for air-gapped machines. Never the default download.
          #
          # The override is a FILE, not an inline JSON string. `run:` on
          # windows-latest is pwsh, which strips the double quotes out of
          # `--config {"bundle":...}` before npx ever sees them, and the
          # resulting `{bundle:{windows:...}}` is not JSON. Quoting around that
          # differs between pwsh and bash and is a trap in both; a path has no
          # quotes to lose. Tauri resolves a relative `--config` against the
          # working directory, which is the repository root here — verified,
          # not assumed: `src-tauri/...` is read, a bare `tauri.offline.conf.json`
          # is not found.
          - name: windows-offline
            os: windows-latest
            args: "--features full"
            edition: full
            tauri-args: "--config src-tauri/tauri.offline.conf.json"
          - name: linux
            os: ubuntu-22.04
            args: "--features full"
            edition: full

    steps:
      - uses: actions/checkout@v5

      - name: Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential \
            curl wget file pkg-config libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build
        run: npx tauri build ${{ matrix.tauri-args }} -- ${{ matrix.args }}
        env:
          MARKLET_EDITION: ${{ matrix.edition }}

      - name: Rename artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          ver="${GITHUB_REF_NAME#v}"
          case "${{ matrix.name }}" in
            windows-full)    cp src-tauri/target/release/bundle/nsis/*.exe "out/marklet-setup-$ver.exe" ;;
            windows-lite)    cp src-tauri/target/release/bundle/nsis/*.exe "out/marklet-lite-setup-$ver.exe" ;;
            windows-offline) cp src-tauri/target/release/bundle/nsis/*.exe "out/marklet-offline-setup-$ver.exe" ;;
            linux)
              cp src-tauri/target/release/bundle/appimage/*.AppImage "out/marklet-$ver.AppImage"
              cp src-tauri/target/release/bundle/deb/*.deb "out/marklet-$ver.deb"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  # Cold start is the promise lite rests on, and a quality bar for full. Both
  # are gated, at different numbers: lite has more to prove and less to load.
  cold-start-gate:
    name: Cold start (${{ matrix.edition }})
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: lite
            artifact: release-windows-lite
            ceiling: 1200
          - edition: full
            artifact: release-windows-full
            ceiling: 1800
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: out
      # Generated rather than committed. A 470 KB blob in the repository would
      # be paid for by every clone forever to serve one CI step, and a corpus
      # file with no `.expected.html` beside it would break the golden-fixture
      # harness, which pairs the two by name. Repeating `kitchen-sink.md` keeps
      # the measurement honest for what it is: every construct the renderer
      # handles, at a size no real note reaches.
      - name: Build the benchmark document
        shell: pwsh
        run: |
          $one = Get-Content tests/fixtures/kitchen-sink.md -Raw
          New-Item -ItemType Directory -Force -Path bench | Out-Null
          Set-Content -Path bench/large.md -Value ($one * 200) -NoNewline
          "benchmark document: {0:N0} bytes" -f (Get-Item bench/large.md).Length |
            Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - name: Best of 9 cold starts
        shell: pwsh
        env:
          CEILING: ${{ matrix.ceiling }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-ChildItem out -Filter *.exe | Select-Object -First 1).FullName
          Start-Process -FilePath $exe -ArgumentList '/S' -Wait

          # Found, not assumed. Tauri's NSIS template has changed where a
          # currentUser install lands more than once, and a hard-coded path
          # that is wrong fails this gate with "the app never printed boot-ms"
          # — a message that points at the app rather than at the path. The
          # two known locations are tried first so the common case costs
          # nothing, then the whole tree.
          $app = @(
            "$env:LOCALAPPDATA\Programs\Marklet\marklet.exe",
            "$env:LOCALAPPDATA\Marklet\marklet.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $app) {
            $app = (Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter marklet.exe `
              -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $app) { throw "the installer ran but marklet.exe is not under $env:LOCALAPPDATA" }
          "installed at: $app" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

          # The number that matters is the one printed by the WINDOW path, in
          # `setup`, after WebviewWindowBuilder::build() has returned — that is
          # WebView2 initialization plus our own work, which is what a user
          # experiences as "how long until I can read". `--benchmark` measures
          # only the render and is reported below for contrast, not gated: it
          # is single-digit milliseconds and would pass any ceiling, which is
          # exactly why it must not be the thing standing in for this one.
          #
          # The app is launched for real and killed once it has said its number;
          # it has no "exit after boot" flag, and adding one would put a test
          # hook in the product to save this loop six lines.
          # Absolute, both of them. `Start-Process` resolves a relative path
          # against the .NET current directory, which is not necessarily the
          # PowerShell location — the app would be handed a path that does not
          # exist and would open empty, and the gate would time out measuring
          # nothing.
          $bench = (Resolve-Path bench/large.md).Path

          function Measure-ColdStart {
            param($run)
            $err = Join-Path (Get-Location) "boot-$run.txt"
            $proc = Start-Process -FilePath $app -ArgumentList $bench `
              -RedirectStandardError $err -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(60)
              while ((Get-Date) -lt $deadline) {
                if (Test-Path $err) {
                  $text = Get-Content $err -Raw -ErrorAction SilentlyContinue
                  if ($text -match 'boot-ms=(\d+)') { return [int]$Matches[1] }
                }
                Start-Sleep -Milliseconds 100
              }
              throw "run ${run}: the app never printed boot-ms within 60 s"
            } finally {
              if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
              $proc.WaitForExit(5000) | Out-Null
            }
          }

          # NINE runs, and the MINIMUM — not the median of five.
          #
          # Three release runs of identical bytes measured medians of 625 ms,
          # 617 ms and 2153 ms. The third looked like this:
          #
          #     5802, 4391, 2153, 1723, 1222 ms
          #
          # Every sample faster than the one before: the whole five-run window
          # was still warming, so the median measured the warming curve rather
          # than the application. A gate that fails on a slow runner and passes
          # on a quiet one teaches people to press re-run, which is worse than
          # having no gate.
          #
          # Both sources of error here — filesystem and loader warming, and a
          # shared runner's scheduling — are ONE-DIRECTIONAL: they can only
          # make a launch slower, never faster. When the noise has a sign, the
          # minimum is the honest estimator of what the work costs and the
          # median is not. This repository already settled that argument once,
          # in the W2 render timing test; same reasoning, same answer.
          #
          # Nine samples rather than five so that "never got a quiet slot" is
          # unlikely rather than merely improbable. If this still fails, the
          # number is real and the answer is to make the app faster or to move
          # the promise — not to widen the window until it passes.
          $times = 1..9 | ForEach-Object { Measure-ColdStart $_ }
          $best = ($times | Measure-Object -Minimum).Minimum
          $ceiling = [int]$env:CEILING

          $render = & $app --benchmark $bench 2>&1 | Out-String
          $renderMs = if ($render -match 'boot-ms=(\d+)') { $Matches[1] } else { 'n/a' }

          @(
            "### Cold start - ${{ matrix.edition }}"
            ""
            "| | | |"
            "|---|---:|---|"
            "| first launch after install | $($times[0]) ms | one-time: WebView2 profile creation. Not gated |"
            "| best of 9 | ${best} ms | **Gated** |"
            "| ceiling | ${ceiling} ms | |"
            "| all runs | $($times -join ', ') ms | the spread is the runner, not the app |"
            "| render only | ${renderMs} ms | \`--benchmark\`, no window. Not gated |"
          ) | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

          if ($best -gt $ceiling) {
            throw "the fastest of nine launches was ${best} ms, over the ${ceiling} ms ceiling"
          }

  publish:
    name: Publish
    needs: [build, cold-start-gate]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: out

      - name: Checksums and size table
        run: |
          set -euo pipefail
          cd out
          sha256sum ./* > SHA256SUMS
          {
            echo "| Artifact | Size |"
            echo "|---|---:|"
            for f in *; do
              [ "$f" = "SHA256SUMS" ] && continue
              printf '| `%s` | %s |\n' "$f" "$(numfmt --to=iec-i --suffix=B --format='%.2f' "$(stat -c%s "$f")")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: true
