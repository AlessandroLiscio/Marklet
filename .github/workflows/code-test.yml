# =============================================================================
# TESTS
# =============================================================================
# Where each kind of test runs, and why:
#
#   Render correctness (golden fixtures)  ubuntu — OS-independent, so pay the
#                                         cheap runner for it
#   Pure TypeScript logic (vitest)        ubuntu — same reason
#   Registry, file association, PrintToPdf  windows — #[cfg(windows)], and a
#                                         mock would only test the mock
#
# The --no-default-features leg is not redundant. The render core is used
# headless by MD_HTML=1 and must not acquire a dependency on a default feature;
# that regression compiles fine in the normal build and only shows up here.
#
# The registry round-trip step (windows-latest only) is one test, not two
# assertions: install, prove the association landed, unbind, prove
# `reg query HKCU\Software\Classes /f marklet /s` returns nothing. It reuses
# the `target/debug/marklet.exe` that `cargo test` above already built — see
# .claude/skills/win-integration/SKILL.md. This step is additive only: it
# must never rename the job below, which forms the required-check context
# `code-test / Tests (windows-latest)` pinned by
# .github/rulesets/protect-main.json.
# =============================================================================

name: Tests

on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    # Load-bearing: forms the required-check context "code-test / Tests".
    # See main.yml.
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential \
            curl wget file pkg-config libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: test-${{ matrix.os }}

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: cargo test (no default features)
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features

      - name: Registry round trip (install/unbind leaves zero residual keys)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = "src-tauri\target\debug\marklet.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built by the cargo test step above" }

          & $exe --install --silent
          if ($LASTEXITCODE -ne 0) { throw "marklet --install exited $LASTEXITCODE" }

          $progid = Get-ItemProperty -Path 'HKCU:\Software\Classes\.md\OpenWithProgids' -Name 'Marklet.Document' -ErrorAction SilentlyContinue
          if (-not $progid) {
            throw "HKCU:\Software\Classes\.md\OpenWithProgids\Marklet.Document was not written by --install"
          }

          & $exe --unbind --silent
          if ($LASTEXITCODE -ne 0) { throw "marklet --unbind exited $LASTEXITCODE" }

          # `reg query` prints "End of search: 0 match(es) found." and exits 1
          # when it finds NOTHING, so testing its output for truthiness reports
          # a clean uninstall as a failure — which is what this step did on its
          # first three runs, while --unbind was working correctly.
          #
          # Only lines naming an actual key are leftovers.
          $leftover = @(
            reg query 'HKCU\Software\Classes' /f marklet /s 2>$null |
              Where-Object { $_ -match '^HKEY_CURRENT_USER\\' }
          )
          if ($leftover.Count -gt 0) {
            throw "residual 'marklet' registry entries survived --unbind:`n$($leftover -join "`n")"
          }

          Write-Host "Registry round trip OK: --install wrote the association, --unbind left zero residual keys."

      - uses: actions/setup-node@v5
        if: matrix.os == 'ubuntu-22.04'
        with:
          node-version: 22
          cache: npm

      - name: vitest
        if: matrix.os == 'ubuntu-22.04'
        run: |
          npm ci
          npm test
