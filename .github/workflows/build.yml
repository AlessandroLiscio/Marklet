name: Build

# Called by main.yml on pull requests and on merges to main. It has no
# triggers of its own: a `push` trigger here would duplicate every build the
# orchestrator already schedules.
on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-full
            os: windows-latest
            lite: ""
            artifact: marklet-setup
          # The lite build drops Mermaid, which is roughly 750 KB of the
          # installer for one feature. It is a first-class artifact, not a
          # curiosity - see .claude/skills/size-budget/SKILL.md.
          - name: windows-lite
            os: windows-latest
            lite: "1"
            artifact: marklet-lite-setup
          - name: linux-full
            os: ubuntu-22.04
            lite: ""
            artifact: marklet-linux

    steps:
      - uses: actions/checkout@v5

      - name: Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential \
            curl wget file pkg-config libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # MARKLET_LITE reaches Vite through tauri's beforeBuildCommand, which is
      # where Mermaid actually lives. There is no cargo feature for it.
      - name: Build
        run: npx tauri build
        env:
          MARKLET_LITE: ${{ matrix.lite }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
