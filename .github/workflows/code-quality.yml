# Formatting, linting and type checking. No tests, no builds — this job exists
# to be fast, so a mistake in it is reported in a couple of minutes rather than
# after a full Tauri build.
name: Code Quality

on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    # Load-bearing: with the `code-quality` job id in main.yml this forms the
    # required-check context "code-quality / Code Quality".
    name: Code Quality
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential \
            curl wget file pkg-config libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: quality

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: svelte-check
        run: npm run check

      # The size budget's most easily broken invariant, and the one a human
      # reviewer will not catch: a heavy top-level import in src/main.ts turns a
      # lazy chunk into a cold-start cost on every launch. Cheaper to assert
      # than to discover from a size-gate failure six commits later.
      - name: No heavy top-level imports on the boot path
        run: npm run check:imports

      # Catches an `invoke()` payload key that no `#[tauri::command]` declares.
      # Nothing else does: both sides compile, and Tauri rejects the call at
      # runtime as a promise that the caller usually never looks at.
      - name: IPC argument names match their commands
        run: npm run check:ipc

      # Catches a chrome selector in print.css that no longer names anything.
      # Also silent: a selector that matches nothing hides nothing, and the
      # only way to see the result is to open an exported PDF on Windows.
      - name: Print stylesheet hides chrome that exists
        run: npm run check:print

      # Catches a keyboard sheet that has drifted from the keymap in either
      # direction: a key listed but no longer bound, or bound but unlisted.
      # Both are silent, and the second is how the application became a third
      # discoverable in the first place.
      - name: Keyboard sheet matches the keymap
        run: npm run check:shortcuts

      - name: Contrast (WCAG AA)
        run: npm run contrast
