# =============================================================================
# SECURITY SCANNING
# =============================================================================
# Three scanners, each answering a different question:
#
#   cargo-deny   — RustSec advisories, licence policy, banned/duplicate crates
#   Trivy (fs)   — vulnerabilities across Cargo.lock AND package-lock.json
#   TruffleHog   — verified secrets anywhere in the git history
#
# Two tools are deliberately absent, both because something here already covers
# them:
#
#   cargo-audit — cargo-deny's `advisories` check reads the same RustSec
#     database. Running both scanned the same lock file against the same data
#     twice. It also needed `checks: write` to post its own check-run, which a
#     fork pull request never gets, so it would have failed there permanently.
#
#   npm audit — Trivy reads package-lock.json and reports the same advisories,
#     with SARIF output that lands in the Security tab.
#
# The weekly schedule matters more here than elsewhere. An advisory published
# on Tuesday affects a dependency that has not changed since March, and nothing
# would otherwise re-scan it.
# =============================================================================

name: Code Security

on:
  schedule:
    - cron: '0 18 * * 5' # 18:00 every Friday
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  security:
    # Load-bearing: forms the required-check context
    # "code-security / Security Analysis". See main.yml.
    name: Security Analysis
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # TruffleHog scans history, not just the tip

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: security

      # -----------------------------------------------------------------------
      # Rust advisories, licence policy, banned crates
      # -----------------------------------------------------------------------
      # `command` is the cargo-deny subcommand; the check types belong in
      # `command-arguments`. Passing them in `command` is accepted by the YAML
      # and rejected by cargo-deny.
      # deny.toml is resolved next to the manifest: src-tauri/deny.toml.
      #
      # Every scanner below carries `continue-on-error` and an id, and the job's
      # verdict is decided once at the end. Without that, the first failure
      # aborts the job and hides every finding after it — which happened twice
      # while this pipeline was being written, both times masking the scanners
      # that had not run yet.
      - name: cargo-deny
        id: deny
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check
          command-arguments: advisories bans licenses sources

      # -----------------------------------------------------------------------
      # Dependency vulnerabilities across both ecosystems
      # -----------------------------------------------------------------------
      - name: Trivy filesystem scan (SARIF)
        id: trivy-sarif
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy

      # A second pass, because trivy-action emits one format per run and the
      # findings must reach the Security tab whether or not they also fail the
      # build. The vulnerability database is cached from the pass above, so this
      # costs seconds rather than a second download.
      - name: Trivy gate (CRITICAL/HIGH)
        id: trivy-gate
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # -----------------------------------------------------------------------
      # Secrets
      # -----------------------------------------------------------------------
      # Verified results only, on purpose: unverified matches on a repository
      # full of hex-looking test fixtures are noise, and a scanner people learn
      # to ignore protects nothing.
      #
      # Pinned to a tag rather than @main. An unpinned third-party action is a
      # supply-chain risk anywhere, and particularly absurd inside the workflow
      # whose job is to catch supply-chain risk.
      #
      # `base: ""` forces a full-history scan. Left unset, the action derives a
      # diff range from the event — and this workflow is reached through
      # workflow_call, where that derivation is not reliable.
      #
      # Do NOT add `--fail` to extra_args: the action passes it already, and
      # trufflehog rejects a repeated flag outright ("flag 'fail' cannot be
      # repeated"), which reads like a scanner failure rather than a typo.
      - name: TruffleHog
        id: trufflehog
        continue-on-error: true
        uses: trufflesecurity/trufflehog@v3.97.4
        with:
          base: ''
          extra_args: --results=verified

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: trivy.sarif
          retention-days: 30
          if-no-files-found: warn

      # -----------------------------------------------------------------------
      # The verdict
      # -----------------------------------------------------------------------
      # One place, after every scanner has had its turn. This is what makes the
      # `continue-on-error` above safe: nothing is swallowed, it is only
      # deferred, and a reader sees all three results instead of the first one.
      - name: Verdict
        run: |
          set -euo pipefail
          deny='${{ steps.deny.outcome }}'
          trivy='${{ steps.trivy-gate.outcome }}'
          secrets='${{ steps.trufflehog.outcome }}'

          {
            echo "| Scanner | Result |"
            echo "|---|---|"
            echo "| cargo-deny (advisories, licences, bans) | \`$deny\` |"
            echo "| Trivy (Cargo.lock + package-lock.json) | \`$trivy\` |"
            echo "| TruffleHog (verified secrets) | \`$secrets\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          for r in "$deny" "$trivy" "$secrets"; do
            [ "$r" = "success" ] || fail=1
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::a security scanner reported findings - see the step logs above"
            exit 1
          fi
          echo "All three scanners clean."
