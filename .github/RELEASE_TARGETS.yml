# Release write-targets for Marklet.
#
# Read by the `release-cut` and `version-sync-check` skills. This file is the
# only thing standing between a release and a bulk substitution across
# version-shaped strings that are not the version — and this repository has
# several of those.

tag_prefix: v

# EVERY location a release moves. All of them, or none. `.github/workflows/
# release.yml` refuses to build if these three disagree with the tag, so a
# partial bump fails loudly instead of shipping an installer whose displayed
# version is wrong.
version_files:
  - path: package.json
    match: '^  "version": '
  - path: src-tauri/Cargo.toml
    match: '^version = '
  - path: src-tauri/tauri.conf.json
    match: '^  "version": '

changelog: CHANGELOG.md

changelog_style: >
  Plain Keep a Changelog: `### Added`, `### Changed`, `### Fixed`, `### Removed`.
  Entries say what a user can now do, not which files changed. Every released
  section also carries the measured installer size and cold-start delta against
  the previous release — users of a tool that calls itself lightweight care
  about that number, and publishing it keeps us honest.

never_touch:
  - path: src-tauri/Cargo.lock
    reason: >
      It contains `name = "marklet"` followed by a `version` line, which looks
      exactly like a write target. It is generated: `cargo build` updates it
      from Cargo.toml. Edit Cargo.toml and rebuild; never hand-edit the lock.
      It is committed on purpose — this crate produces a binary, so the lock is
      part of the reproducible build.
  - path: src-tauri/tauri.conf.json
    reason: >
      The `$schema` field pins Tauri's config schema version and the `identifier`
      is an app id. Anchor to `^  "version": ` — an unanchored `version` pattern
      catches both, plus every dependency version in package.json.
  - path: package-lock.json
    reason: >
      Generated by npm, and it carries the package version twice plus the pinned
      version of every dependency. `npm install` updates it from package.json.
  - path: docs/size-budget.md
    reason: >
      Records measured sizes per release (e.g. "v0.1.0 foundation"). Those are
      historical measurements, not the current version.

# The tag push IS the release: .github/workflows/release.yml triggers on `v*`,
# verifies the three version files agree with the tag, builds the full, lite and
# offline installers plus the Linux packages, runs the size and cold-start
# gates, and opens a DRAFT GitHub release with SHA256SUMS.
#
# Draft, not published: step 6 of .claude/skills/release/SKILL.md is a manual
# install-and-uninstall on real Windows, which CI cannot do.
publishes_on_tag_push: true
