name: Feature request
description: Propose something Marklet should be able to do
title: 'feat: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Marklet ships two editions with different rules. **Lite** is held to 2.8 MiB
        by CI, and roughly 1.45 MiB of that is uncommitted. **Full** is deliberately
        not size-constrained and is where the expensive good ideas go.

        A proposal that costs bytes is welcome — it just needs to say which edition
        it is for. See docs/editions.md.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, not the solution. What are you reading or writing when this comes up?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What should Marklet do
    validations:
      required: true

  - type: dropdown
    id: edition
    attributes:
      label: Which edition
      description: 'If it costs real bytes, it probably belongs in full. See docs/editions.md.'
      options:
        - Full only — it costs bytes or complexity
        - Both — it is small, or costs nothing
        - Lite specifically — it makes the small edition better
        - Not sure
    validations:
      required: true

  - type: input
    id: cost
    attributes:
      label: Rough size cost, if you know it
      description: 'A library this would need, and its size. "No idea" is fine.'
      placeholder: 'e.g. needs a diff library, ~40 KB compressed'

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: Another tool, a workaround, or nothing.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I have read the non-goals in README.md and this is not one of them
        - label: This is reading- or note-taking-shaped, not an attempt to make Marklet a full editor
