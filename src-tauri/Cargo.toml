[package]
name = "marklet"
version = "0.1.0"
description = "Lightweight, open-source Markdown viewer. Reading first."
authors = ["Alessandro Liscio"]
license = "MIT"
repository = "https://github.com/AlessandroLiscio/Marklet"
edition = "2021"
rust-version = "1.79"

[lib]
name = "marklet"
path = "src/lib.rs"

[[bin]]
name = "marklet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No `protocol-asset`: local images are served by our own `marklet://` scheme,
# which is smaller and lets us reject path traversal in one place. Enabling the
# feature here while `assetProtocol.enable` is false in tauri.conf.json is a
# hard build error, and rightly so.
tauri = { version = "2.11", default-features = false, features = ["wry", "common-controls-v6"] }
tauri-plugin-single-instance = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Render core. Kept free of any tauri dependency so `MD_HTML=1` runs headless.
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd", "html"] }

# Vault: streaming scan + literal multi-term search. No index, by design.
walkdir = "2"
memchr = "2"
aho-corasick = "1.1"

# Live reload.
notify = "8"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.5"
# These two versions are ONE decision, not two.
#
# `PrintToPdf` (src-tauri/src/export/pdf.rs) is called on the ICoreWebView2 that
# Tauri hands us, so our webview2-com must be the exact one wry 0.55.1 resolves
# to — 0.38.2 — or the pointer is a different Rust type and will not cast.
# webview2-com 0.38.2 in turn pins `windows` 0.61 and `windows-core` 0.61, which
# is why `windows` below is 0.61 and not the newer 0.62: `.cast()` comes from
# `windows_core::Interface`, and with two windows-core crates in the tree the
# trait we import is not the trait the interface implements. That failure reads
# as "no method named `cast` found for reference `&ICoreWebView2_2`", which
# names neither version and sends you looking in the wrong place.
#
# Nothing else in the tree asks for 0.62; the only thing that did was this
# declaration. Unifying downward therefore also removes a duplicate `windows`
# facade from the binary.
#
# Bump either line only together with a Tauri bump, and only if afterwards
#   grep -c 'name = "webview2-com"' Cargo.lock   still prints 1
#   grep -c 'name = "windows-core"' Cargo.lock   still prints 1
# `scripts/check-windows.sh` catches the mismatch from Linux in ~15 s.
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# PDF export's Linux half (src-tauri/src/export/pdf.rs): webkit_print_operation
# via WebKitGTK. Zero marginal installer size — `tauri-runtime-wry`'s Linux
# backend already links webkit2gtk 2.0.2 and gtk 0.18.2 (see Cargo.lock); this
# just names them directly instead of reaching them only through Tauri's own
# (narrower) re-exports. size-budget's "every new dependency" rule still
# applies to the *declaration*, hence this note, even though the bytes are
# already paid for.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"

[features]
# Marklet ships as TWO products from one codebase. `default` is the lite
# edition, because a feature that forgets to declare its edition should land in
# the constrained one and fail the gate loudly, rather than land in the generous
# one and never be noticed.
default = []

# The full edition. Everything the lite budget cannot afford.
full = ["full-encodings", "regex-search"]

# Mermaid is NOT a cargo feature. Its 750 KB live in the frontend bundle, so the
# edition is also carried by `MARKLET_EDITION`, which Vite reads. Gating Mermaid
# here would have gated nothing. See docs/editions.md.

# encoding_rs + chardetng for universal (CJK) encoding detection. ~+500 KB.
# Lite ships BOM sniff -> UTF-8 -> Windows-1252 only, which covers the vast
# majority of real-world .md on a Western machine.
full-encodings = ["dep:encoding_rs", "dep:chardetng"]

# Full regex vault search via the ripgrep stack. ~+1.2-1.8 MB.
# Lite ships literal multi-term AND, which covers the common case at no cost.
# `ignore` is deliberately NOT here. The regex path reuses `vault::scan::walk`,
# so literal and regex search traverse identically; a .gitignore-aware regex
# mode that disagreed with literal mode about which files exist would be a bug
# factory. Measured cost of this feature: +1.25 MB raw, +386 KB xz.
regex-search = ["dep:grep-regex", "dep:grep-searcher"]

[dependencies.encoding_rs]
version = "0.8"
optional = true

[dependencies.chardetng]
version = "0.1"
optional = true

[dependencies.grep-regex]
version = "0.1"
optional = true

[dependencies.grep-searcher]
version = "0.1"
optional = true

# Every flag here is a size decision. `opt-level = "z"` plus fat LTO plus a
# single codegen unit is worth roughly 30-40% of the stripped binary versus the
# defaults, and `panic = "abort"` removes the unwinding tables. Do not relax
# these to speed up release builds - CI gates the installer size.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false

# Dev builds keep unwinding so test failures are readable.
[profile.dev]
opt-level = 0
